[Soggfy]
; Classic UI recreates the original Soggfy top-bar integration.
Classic UI=1
; Optional fallback to Floggfy's native To Disk menu when Classic UI=0.
Native Menu=0
Playback Speed=1
Skip Downloaded Tracks=0
Skip Ignored Tracks=0
Embed Cover Art=1
Save Cover Art=1
Embed Lyrics=1
Save Lyrics=1
Save Canvas=0
Block Telemetry=1
Lift Add To Queue=0
Keep Native Original=1
Output Preset=Native
Output Ext=
Output Args=
FFmpeg Path=
Podcast Template=Podcasts/{artist_name}/{album_name}/{release_date} - {track_name}.{ext}
Canvas Template={artist_name}/{album_name}{multi_disc_path}/Canvas/{track_num}. {track_name}.mp4
Invalid Char Replacement=unicode

[To Disk]
; Restart-only connectivity workaround. Set 1 only to opt in.
NetworkPatch=0
Downloads=0
; Empty uses the Windows Music folder plus \Spotify.
Save Location=
; Fresh installs use the original Soggfy-style track template. Clear this for the smart layout.
Path Template={artist_name}/{album_name}{multi_disc_path}/{track_num}. {track_name}.{ext}
; Path-only cleanup; leaves names such as AC/DC alone.
Normalize Artist Separators=1
Ogg=1
; Captures native FLAC when Spotify supplies lossless audio.
Flac=1
; Reads existing renderer and local client caches; makes no requests.
Metadata=1
; Activity log in Save Location, capped at 5 MiB.
Log=1
DebugLog=0
; 0 off, 1 completions/warnings/failures, 2 activity, 4 diagnostics.
LogLevel=1
; Default off. Diagnostic raw audio stream evidence, capped at 64 MiB per session.
StreamDump=0

[History]
; Maximum compressed audio held in RAM for one track.
MaxBufferedMiB=500
