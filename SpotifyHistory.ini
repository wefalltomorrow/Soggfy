[To Disk]
; Settings also appear in the To Disk menu.
Downloads=0
; Set Menu=0 before starting Spotify to disable native menu integration.
Menu=1
; Empty uses the Windows Music folder plus \Spotify.
Save Location=
; Optional Soggfy-style relative path template. Empty keeps the smart layout.
; Tokens: {artist_name} {all_artist_names} {album_name} {track_name}
;         {track_num} {track_num_2} {disc_num} {release_year}
;         {multi_disc_path} {multi_disc_paren} {ext}
Path Template=
; Path-only cleanup: converts "Artist A / Artist B" to "Artist A, Artist B".
; Names like AC/DC stay intact. Embedded tags are never changed by this option.
Normalize Artist Separators=1
Ogg=1
; Captures native FLAC when Spotify supplies lossless audio.
Flac=1
; Reads existing renderer and local client caches; makes no requests.
Metadata=1
; Activity log in Save Location, capped at 5 MiB.
Log=1
DebugLog=0

[History]
; Maximum compressed audio held in RAM for one track.
MaxBufferedMiB=500
