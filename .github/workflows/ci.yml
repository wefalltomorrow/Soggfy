name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 nodejs ffmpeg
      - name: Run native regression suite
        run: bash test-native.sh

  sanitizer-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [4043931417, 1592594996]
    steps:
      - uses: actions/checkout@v7
      - name: Install sanitizer toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ffmpeg
      - name: Run deterministic ASan and UBSan campaign
        env:
          CC: clang
          CXX: clang++
        run: bash test-sanitizers.sh 20000 ${{ matrix.seed }}

  windows-release-build:
    needs: [native-tests, sanitizer-tests]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem Scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }
          "SGF_PWSH_PATH=$((Get-Process -Id $PID).Path)" >> $env:GITHUB_ENV
          "SGF_PYTHON_PATH=$((Get-Command python.exe -ErrorAction Stop).Source)" >> $env:GITHUB_ENV

      - name: Set up newer MinGW-w64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-ffmpeg
            python

      - name: Verify toolchain floor
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc_version="$(gcc -dumpfullversion -dumpversion)"
          ld_version="$(ld --version | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n 1)"
          python - "$gcc_version" "$ld_version" <<'PY'
          import re, sys
          gcc, ld = sys.argv[1:3]
          def nums(value):
              found = re.search(r"\d+(?:\.\d+)+", value)
              if not found:
                  raise SystemExit(f"Could not parse tool version: {value}")
              return tuple(int(x) for x in found.group(0).split("."))
          if nums(gcc) < (14,):
              raise SystemExit(f"GCC 14+ required for release builds, got {gcc}")
          if nums(ld) < (2, 44):
              raise SystemExit(f"binutils 2.44+ required for release builds, got {ld}")
          print(f"Accepted release toolchain: GCC {gcc}, binutils {ld}")
          PY

      - name: Test Windows media observer boundary
        shell: msys2 {0}
        env:
          CXX: g++
        run: bash test-media-observer-windows.sh

      - name: Test conversion and library status maintenance
        shell: msys2 {0}
        env:
          CXX: g++
        run: bash test-maintenance-windows.sh

      - name: Test Windows publication, settings, logging, metadata and quality
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: bash test-native-windows.sh

      - name: Build Windows x64 DLL
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
          WINDRES: windres
          STRIP: strip
          LD: ld
          OBJDUMP: objdump
          PYTHON: python
        run: |
          set -euo pipefail
          bash build-native.sh
          cmp build/validation-worker/validation-worker.exe build/windows-tests/validation-process/validation-worker.exe
          echo 'Release helper matches the fully exercised test helper byte-for-byte.'

      - name: Package release
        shell: msys2 {0}
        run: python package-release.py

      - name: Verify PE metadata and release hashes
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="Soggfy-v${version}-Windows-x64.zip"
          test -f build/Soggfy.exe
          objdump -h build/version.dll | grep -q '\.rsrc'
          strings -el build/version.dll | grep -Fq 'Soggfy Spotify history capture proxy'
          strings -el build/version.dll | grep -Fq "$version"
          for binary in build/version.dll build/Soggfy.exe; do
            imports="$(objdump -p "$binary")"
            grep -iq 'DLL Name: msvcrt.dll' <<< "$imports"
            if grep -Ei 'DLL Name: (libwinpthread|libgcc|libstdc[+][+])' <<< "$imports"; then
              echo "Unexpected dynamic MinGW runtime dependency in $binary" >&2
              exit 1
            fi
          done
          cd dist
          grep -Fq "  $archive" SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          python - "$archive" <<'PY'
          import hashlib, re, sys, zipfile
          required = {
              "version.dll",
              "Launcher/Soggfy.exe",
              "Launcher/Soggfy.dll",
              "SpotifyHistory.ini",
              "Launcher/SpotifyHistory.ini",
              "BUILDINFO.txt",
              "SHA256SUMS.txt",
              "README.md",
              "Scripts/Install.ps1",
              "Scripts/Uninstall.ps1",
              "Scripts/PostProcess.ps1",
              "Scripts/ConverterProcess.cs",
              "Scripts/Diagnose.ps1",
              "Scripts/ValidationWorker.ps1",
              "VALIDATION_WORKER.txt",
              "third-party/libvorbis/LICENSE.txt",
              "third-party/libFLAC/LICENSE.txt",
          }
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = set(z.namelist())
              digest = z.read("VALIDATION_WORKER.txt").decode("ascii").strip()
              assert re.fullmatch(r"[a-f0-9]{64}", digest)
              worker = f"SoggfyValidation-{digest}.exe"
              assert z.read(worker) == z.read("Launcher/" + worker)
              assert hashlib.sha256(z.read(worker)).hexdigest() == digest
              assert digest.encode() in z.read("version.dll")
              assert z.read("version.dll") == z.read("Launcher/Soggfy.dll")
              for line in z.read("SHA256SUMS.txt").decode().splitlines():
                  expected, path = line.split("  ", 1)
                  assert hashlib.sha256(z.read(path)).hexdigest() == expected, path
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing release files: " + ", ".join(missing))
          print("All-in-one ZIP contains automatic and launcher payloads.")
          PY

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Soggfy-Windows-x64
          path: dist/Soggfy-v*-Windows-x64.zip
          if-no-files-found: error
