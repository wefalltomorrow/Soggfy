name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 nodejs mingw-w64

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem Scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Run native regression suite
        run: bash test-native.sh

      - name: Build Windows x64 DLL
        run: bash build-native.sh

      - name: Package release
        run: python3 package-release.py

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Soggfy-Windows-x64
          path: dist/*
          if-no-files-found: error
