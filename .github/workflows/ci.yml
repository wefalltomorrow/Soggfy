name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 nodejs
      - name: Run native regression suite
        run: bash test-native.sh

  windows-release-build:
    needs: native-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem Scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Set up newer MinGW-w64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          update: true
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            python

      - name: Verify toolchain floor
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc_version="$(gcc -dumpfullversion -dumpversion)"
          ld_version="$(ld --version | head -n 1 | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n 1)"
          python - "$gcc_version" "$ld_version" <<'PY'
          import re, sys
          gcc, ld = sys.argv[1:3]
          def nums(value):
              found = re.search(r"\d+(?:\.\d+)+", value)
              if not found:
                  raise SystemExit(f"Could not parse tool version: {value}")
              return tuple(int(x) for x in found.group(0).split("."))
          if nums(gcc) < (14,):
              raise SystemExit(f"GCC 14+ required for release builds, got {gcc}")
          if nums(ld) < (2, 44):
              raise SystemExit(f"binutils 2.44+ required for release builds, got {ld}")
          print(f"Accepted release toolchain: GCC {gcc}, binutils {ld}")
          PY

      - name: Build Windows x64 DLL
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
          WINDRES: windres
          STRIP: strip
          LD: ld
          PYTHON: python
        run: bash build-native.sh

      - name: Package release
        shell: msys2 {0}
        run: python package-release.py

      - name: Verify PE metadata and release hashes
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          archive="Soggfy-v${version}-Windows-x64.zip"
          objdump -h build/version.dll | grep -q '\.rsrc'
          strings -el build/version.dll | grep -Fq 'Soggfy Spotify history capture proxy'
          strings -el build/version.dll | grep -Fq "$version"
          objdump -p build/version.dll | grep -iq 'DLL Name: msvcrt.dll'
          if objdump -p build/version.dll | grep -iq 'DLL Name: libwinpthread-1.dll'; then
            echo 'Unexpected dynamic MinGW pthread runtime dependency' >&2
            exit 1
          fi
          cd dist
          grep -Fq "  version.dll" SHA256SUMS.txt
          grep -Fq "  $archive" SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Soggfy-Windows-x64
          path: dist/*
          if-no-files-found: error
