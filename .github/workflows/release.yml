name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 nodejs mingw-w64

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem Scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Run native regression suite
        run: bash test-native.sh

      - name: Build Windows x64 DLL
        run: bash build-native.sh

      - name: Package release
        run: python3 package-release.py

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"
          archive="dist/Soggfy-v${version}-Windows-x64.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag"             "$archive#Soggfy Windows x64"             "dist/SHA256SUMS.txt#SHA-256 checksum"             --target "$GITHUB_SHA"             --title "Soggfy $tag"             --notes-file RELEASE_NOTES.md
